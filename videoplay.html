<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
margin:0;
background:black;
}

video{
position:absolute;
width:100%;
height:100vh;
object-fit:contain;
}
</style>

</head>
<body>

<video id="v1" playsinline></video>
<video id="v2" playsinline style="display:none"></video>

<script>

const videos=[
"video1.mp4",
"video2.mp4",
"video3.mp4"
];

let index=0;

let current=document.getElementById("v1");
let next=document.getElementById("v2");

function loadNext(){

next.src=videos[(index+1)%videos.length];
next.load();

}

function play(){

current.src=videos[index];
current.play();
loadNext();

}

current.addEventListener("ended",()=>{

index=(index+1)%videos.length;

// プレイヤー入れ替え
[current,next]=[next,current];

current.style.display="block";
next.style.display="none";

current.play();
loadNext();

});

play();

</script>

</body>
</html>
