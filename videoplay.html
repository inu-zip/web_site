<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Video Playlist</title>

<style>
body{
margin:0;
background:black;
}

video{
width:100%;
height:100vh;
object-fit:contain;
background:black;
}
</style>

</head>
<body>

<video id="videoPlayer" controls playsinline></video>

<script>

const videos=[
"video1.mp4",
"video2.mp4",
"video3.mp4"
];

let index=0;
const player=document.getElementById("videoPlayer");

function playVideo(){
player.src=videos[index];
player.play();
}

player.addEventListener("ended",()=>{
index=(index+1)%videos.length;
playVideo();
});

playVideo();

</script>

</body>
</html>
