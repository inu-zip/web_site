<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Loop</title>
</head>
<body>

<video id="videoPlayer" width="640" height="360" autoplay muted></video>

<script>
const videos = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4"
];

let index = 0;
const player = document.getElementById("videoPlayer");

function playVideo(i) {
  player.src = videos[i];
  player.play();
}

player.addEventListener("ended", () => {
  index++;
  if (index >= videos.length) {
    index = 0; // ループ
  }
  playVideo(index);
});

// 最初の動画
playVideo(index);
</script>

</body>
</html>
</body>
</html>
