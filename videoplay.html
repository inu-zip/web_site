<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Video Playlist Loop</title>

<style>
body{
  margin:0;
}

video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
}
</style>

</head>
<body>

<button id="startBtn">再生</button>

<video id="videoPlayer" playsinline></video>

<script>

const videos = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4"
];

let index = 0;
const player = document.getElementById("videoPlayer");

function playVideo(){
  player.src = videos[index];
  player.play();
}

player.addEventListener("timeupdate", () => {

  if(player.duration && player.currentTime >= player.duration - 0.2){
    index = (index + 1) % videos.length;
    playVideo();
  }

});

document.getElementById("startBtn").onclick = () => {
  playVideo();
  document.getElementById("startBtn").style.display="none";
};

</script>

</body>
</html>
