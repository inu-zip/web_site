<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Video Playlist</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:sans-serif;
}

#container{
display:flex;
height:100vh;
}

#player{
flex:3;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

#playlist{
flex:1;
background:#222;
overflow-y:auto;
}

.item{
padding:15px;
border-bottom:1px solid #444;
cursor:pointer;
}

.item:hover{
background:#333;
}

.active{
background:#555;
}

</style>
</head>
<body>

<div id="container">

<div id="player">
<video id="videoPlayer" controls playsinline></video>
</div>

<div id="playlist">
<div class="item" onclick="play(0)">video1</div>
<div class="item" onclick="play(1)">video2</div>
<div class="item" onclick="play(2)">video3</div>
</div>

</div>

<script>

const videos=[
"video1.mp4",
"video2.mp4",
"video3.mp4"
];

let index=0;
const player=document.getElementById("videoPlayer");
const items=document.querySelectorAll(".item");

function play(i){

index=i;

player.src=videos[index];
player.play();

items.forEach(el=>el.classList.remove("active"));
items[index].classList.add("active");

}

player.addEventListener("ended",()=>{

index++;

if(index>=videos.length) index=0;

play(index);

});

play(0);

</script>

</body>
</html>
