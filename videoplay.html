<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
margin:0;
background:black;
}

video{
width:100%;
height:100vh;
object-fit:contain;
background:black;
}

#start{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:20px;
padding:15px 30px;
}
</style>

</head>
<body>

<video id="player" controls playsinline></video>

<button id="start">再生</button>

<script>

const videos=[
"video1.mp4",
"video2.mp4",
"video3.mp4"
];

let index=0;

const player=document.getElementById("player");
const start=document.getElementById("start");

function playVideo(){
player.src=videos[index];
player.play();
}

player.addEventListener("ended",()=>{

index=(index+1)%videos.length;

playVideo();

});

start.onclick=()=>{

playVideo();
start.style.display="none";

};

</script>

</body>
</html>
