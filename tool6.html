<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>画像 → カラータグ配列</title>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    canvas { border: 1px solid #ccc; display: block; margin-top: 8px; }
    label { display: block; margin-top: 8px; }
    textarea { width: 100%; height: 200px; margin-top: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>画像 → [@color:xxxxxx] 配列</h1>

  <label>
    画像ファイル:
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <label>
    幅（px）:
    <input type="number" id="widthInput" value="128" min="1">
  </label>

  <label>
    高さ（px）:
    <input type="number" id="heightInput" value="128" min="1">
  </label>

  <button id="convertBtn">配列に変換</button>

  <canvas id="canvas" width="128" height="128"></canvas>

  <h2>出力配列</h2>
  <textarea id="output" readonly></textarea>

  <script>
    const fileInput   = document.getElementById('fileInput');
    const widthInput  = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const convertBtn  = document.getElementById('convertBtn');
    const canvas      = document.getElementById('canvas');
    const ctx         = canvas.getContext('2d');
    const output      = document.getElementById('output');

    let loadedImage = null;

    // 画像読み込み
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        loadedImage = img;

        widthInput.value  = img.width;
        heightInput.value = img.height;

        canvas.width  = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, img.width, img.height);
      };
      img.src = URL.createObjectURL(file);
    });

    // 配列に変換
    convertBtn.addEventListener('click', () => {
      if (!loadedImage) {
        alert('先に画像を選択してください');
        return;
      }

      const w = parseInt(widthInput.value, 10);
      const h = parseInt(heightInput.value, 10);

      canvas.width  = w;
      canvas.height = h;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(loadedImage, 0, 0, w, h);

      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      const arr = [];

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const hex =
          r.toString(16).padStart(2, "0") +
          g.toString(16).padStart(2, "0") +
          b.toString(16).padStart(2, "0");

        arr.push(`@color:${hex}`);
      }

      output.value = JSON.stringify(arr, null, 2);
    });
  </script>
</body>
</html>
