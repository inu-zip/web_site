<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>画像の配列化ツール</title>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    canvas { border: 1px solid #ccc; display: block; margin-top: 8px; }
    label { display: block; margin-top: 8px; }
    textarea { width: 100%; height: 200px; margin-top: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>画像 → 1次元配列（RGBA）</h1>

  <label>
    画像ファイル:
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <label>
    幅（px）:
    <input type="number" id="widthInput" value="128" min="1">
  </label>

  <label>
    高さ（px）:
    <input type="number" id="heightInput" value="128" min="1">
  </label>

  <button id="convertBtn">配列に変換</button>

  <canvas id="canvas" width="128" height="128"></canvas>

  <h2>一次元配列（Uint8 RGBA）</h2>
  <textarea id="output" readonly></textarea>

  <script>
    const fileInput   = document.getElementById('fileInput');
    const widthInput  = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const convertBtn  = document.getElementById('convertBtn');
    const canvas      = document.getElementById('canvas');
    const ctx         = canvas.getContext('2d');
    const output      = document.getElementById('output');

    let loadedImage = null;

    // 画像読み込み
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        // とりあえず元画像サイズを入力欄に反映
        widthInput.value  = img.width;
        heightInput.value = img.height;

        canvas.width  = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, img.width, img.height);
      };
      img.onerror = () => {
        alert('画像の読み込みに失敗しました');
      };
      img.src = URL.createObjectURL(file);
    });

    // 配列に変換
    convertBtn.addEventListener('click', () => {
      if (!loadedImage) {
        alert('先に画像を選択してください');
        return;
      }

      const w = parseInt(widthInput.value, 10);
      const h = parseInt(heightInput.value, 10);
      if (!w || !h || w <= 0 || h <= 0) {
        alert('幅・高さには1以上の数値を入力してください');
        return;
      }

      // キャンバスを指定サイズに変更してリサイズ描画
      canvas.width  = w;
      canvas.height = h;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(loadedImage, 0, 0, w, h);

      // ピクセルデータ取得（RGBA の一次元配列）
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data; // Uint8ClampedArray

      // 表示用に通常の配列に変換（そのままでもいいけど見やすさ優先）
      const arr = Array.from(data);

      // 例: JS の配列リテラル形式で出力
      output.value = `// width=${w}, height=${h}, length=${arr.length} (RGBA)\n` +
                     `const pixels = [\n  ` +
                     arr.map((v, i) => {
                       const sep = (i % 16 === 15) ? ',\n  ' : ', ';
                       return v + sep;
                     }).join('').replace(/,\s*$/, '') +
                     `\n];`;
    });
  </script>
</body>
</html>
