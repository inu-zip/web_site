<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>新聞作成ツール</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f0f0f0;
    }

    .page {
      width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border: 1px solid #ccc;
    }

    .title {
      background: #b7e1cd; /* 緑系 */
      padding: 10px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }

    .main-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .photo {
      flex: 3;
      background: #f4c2c2; /* ピンク系 */
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .photo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-label {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 6px;
      font-size: 0.8rem;
      border-radius: 3px;
    }

    .side {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .headline {
      background: #c6dafc; /* 青系 */
      padding: 10px;
      min-height: 120px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .meta {
      background: #c6dafc; /* 青系 */
      padding: 10px;
      font-size: 0.9rem;
    }

    .content {
      background: #fff9c4; /* 黄色系 */
      padding: 10px;
      min-height: 200px;
      margin-top: 10px;
      line-height: 1.6;
    }

    .label {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 4px;
    }

    /* 入力フォーム部分 */
    .controls {
      width: 800px;
      margin: 20px auto 0;
      background: #ffffff;
      border: 1px solid #ccc;
      padding: 15px;
    }

    .controls h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .controls-row > div {
      flex: 1;
      min-width: 180px;
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 6px;
      font-size: 0.9rem;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      font-size: 0.9rem;
    }

    button {
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 新聞レイアウト -->
  <div class="page">
    <div class="title" id="view-title">題名をここに入力</div>

    <div class="main-row">
      <div class="photo" id="view-photo">
        <span class="photo-label">写真</span>
        <!-- 画像はJSで挿入 -->
      </div>

      <div class="side">
        <div class="headline" id="view-headline">
          見出しをここに入力
        </div>
        <div class="meta">
          <div><span class="label">発行日:</span> <span id="view-date">----</span></div>
          <div><span class="label">発行者名:</span> <span id="view-publisher">----</span></div>
        </div>
      </div>
    </div>

    <div class="content" id="view-content">
      内容をここに入力
    </div>
  </div>

  <!-- 入力コントロール -->
  <div class="controls">
    <h2>新聞内容の入力</h2>

    <div class="controls-row">
      <div>
        <div class="label">題名</div>
        <input type="text" id="input-title" placeholder="題名を入力" />
      </div>
      <div>
        <div class="label">発行日</div>
        <input type="date" id="input-date" />
      </div>
      <div>
        <div class="label">発行者名</div>
        <input type="text" id="input-publisher" placeholder="発行者名を入力" />
      </div>
    </div>

    <div class="controls-row">
      <div>
        <div class="label">見出し</div>
        <textarea id="input-headline" placeholder="見出しを入力"></textarea>
      </div>
      <div>
        <div class="label">内容</div>
        <textarea id="input-content" placeholder="本文・内容を入力"></textarea>
      </div>
    </div>

    <div class="controls-row">
      <div>
        <div class="label">写真画像</div>
        <input type="file" id="input-photo" accept="image/*" />
      </div>
      <div style="display:flex; align-items:flex-end; gap:10px;">
        <button id="btn-clear">すべてクリア</button>
      </div>
    </div>
  </div>

  <script>
    const inputTitle = document.getElementById("input-title");
    const inputDate = document.getElementById("input-date");
    const inputPublisher = document.getElementById("input-publisher");
    const inputHeadline = document.getElementById("input-headline");
    const inputContent = document.getElementById("input-content");
    const inputPhoto = document.getElementById("input-photo");

    const viewTitle = document.getElementById("view-title");
    const viewDate = document.getElementById("view-date");
    const viewPublisher = document.getElementById("view-publisher");
    const viewHeadline = document.getElementById("view-headline");
    const viewContent = document.getElementById("view-content");
    const viewPhoto = document.getElementById("view-photo");

    inputTitle.addEventListener("input", () => {
      viewTitle.textContent = inputTitle.value || "題名をここに入力";
    });

    inputDate.addEventListener("input", () => {
      viewDate.textContent = inputDate.value || "----";
    });

    inputPublisher.addEventListener("input", () => {
      viewPublisher.textContent = inputPublisher.value || "----";
    });

    inputHeadline.addEventListener("input", () => {
      viewHeadline.textContent = inputHeadline.value || "見出しをここに入力";
    });

    inputContent.addEventListener("input", () => {
      viewContent.textContent = inputContent.value || "内容をここに入力";
    });

    inputPhoto.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        // 既存の画像を削除
        const oldImg = viewPhoto.querySelector("img");
        if (oldImg) oldImg.remove();

        const img = document.createElement("img");
        img.src = event.target.result;
        viewPhoto.appendChild(img);
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("btn-clear").addEventListener("click", () => {
      inputTitle.value = "";
      inputDate.value = "";
      inputPublisher.value = "";
      inputHeadline.value = "";
      inputContent.value = "";
      inputPhoto.value = "";

      viewTitle.textContent = "題名をここに入力";
      viewDate.textContent = "----";
      viewPublisher.textContent = "----";
      viewHeadline.textContent = "見出しをここに入力";
      viewContent.textContent = "内容をここに入力";

      const oldImg = viewPhoto.querySelector("img");
      if (oldImg) oldImg.remove();
    });
  </script>
</body>
</html>
