<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ミニ言語 関数例:if/goto/func/while/global</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; background: #fafafa; }
    label { font-weight: bold; display: block; margin-top: 1rem; }
    textarea { width: 100%; height: 220px; font-family: monospace; }
    pre { background: #f0f0f0; padding: 0.75rem; border: 1px solid #ccc; }
    button { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>ミニ言語　関数例:（let / print / if / goto / func / while / global）</h1>

  <label for="src">プログラム入力:</label>
  <textarea id="src">global counter
let counter = 0

func loopBody() {
  print counter
  let counter = counter + 1
  return 0
}

while counter < 3 loopBody
print 999</textarea>
  <button id="run">実行</button>

  <label for="out">実行結果:</label>
  <pre id="out"></pre>

<script>
(() => {
  // 行単位に分割
  function parseLines(src) {
    return src.split(/\n/).map(line => line.trim()).filter(l => l.length > 0);
  }

  // 式評価（簡易）
  function evalExpr(expr, env, funcs) {
    // 関数呼び出し
    const callMatch = expr.match(/^(\w+)\((.*)\)$/);
    if (callMatch) {
      const fname = callMatch[1];
      const args = callMatch[2].split(",").map(s=>s.trim()).filter(s=>s);
      const f = funcs[fname];
      if (!f) throw new Error("未定義関数: "+fname);
      const localEnv = Object.create(env);
      f.args.forEach((a,i)=>{ localEnv[a]=evalExpr(args[i], env, funcs); });
      let ret = 0;
      for (let line of f.body) {
        if (line.startsWith("return ")) {
          ret = evalExpr(line.slice(7), localEnv, funcs);
          break;
        } else if (line.startsWith("let ")) {
          const [, rest] = line.split("let ");
          const [name, ex] = rest.split("=");
          localEnv[name.trim()] = evalExpr(ex.trim(), localEnv, funcs);
        } else if (line.startsWith("print ")) {
          console.log(evalExpr(line.slice(6), localEnv, funcs));
        }
      }
      return ret;
    }
    // 変数置換
    const replaced = expr.replace(/\b\w+\b/g, id => {
      if (!isNaN(Number(id))) return id;
      if (id in env) return env[id];
      return id;
    });
    return Function("return "+replaced)();
  }

  // プログラム実行
  function runProgram(lines, outputCb) {
    const env = Object.create(null);
    const labels = {};
    const funcs = {};

    // ラベル位置を記録
    lines.forEach((line, idx) => {
      if (line.startsWith("label ")) {
        const name = line.split(/\s+/)[1];
        labels[name] = idx;
      }
    });

    let pc = 0;
    while (pc < lines.length) {
      const line = lines[pc];
      if (line.startsWith("global ")) {
        const name = line.split(/\s+/)[1];
        env[name] = env[name] ?? 0;
        pc++;
      } else if (line.startsWith("let ")) {
        const [, rest] = line.split("let ");
        const [name, expr] = rest.split("=");
        env[name.trim()] = evalExpr(expr.trim(), env, funcs);
        pc++;
      } else if (line.startsWith("print ")) {
        outputCb(String(evalExpr(line.slice(6), env, funcs)));
        pc++;
      } else if (line.startsWith("goto ")) {
        const label = line.split(/\s+/)[1];
        pc = labels[label];
      } else if (line.startsWith("if ")) {
        const parts = line.split(/\s+/);
        const expr = parts[1];
        const label = parts[3];
        if (evalExpr(expr, env, funcs) !== 0) {
          pc = labels[label];
        } else {
          pc++;
        }
      } else if (line.startsWith("label ")) {
        pc++;
      } else if (line.startsWith("func ")) {
        const m = line.match(/^func\s+(\w+)\(([^)]*)\)\s*{/);
        const name = m[1];
        const args = m[2].split(",").map(s=>s.trim()).filter(s=>s);
        const body = [];
        pc++;
        while (pc < lines.length && !lines[pc].startsWith("}")) {
          body.push(lines[pc]);
          pc++;
        }
        funcs[name] = { args, body };
        pc++; // skip }
      } else if (line.startsWith("while ")) {
        const rest = line.slice(6).trim();
        const lastSpace = rest.lastIndexOf(' ');
        if (lastSpace < 0) throw new Error("while 構文: 'while <式> <関数名>' の形式にしてください");
        const condExpr = rest.slice(0, lastSpace).trim();
        const funcName = rest.slice(lastSpace + 1).trim();

        while (evalExpr(condExpr, env, funcs) !== 0) {
          const f = funcs[funcName];
          if (!f) throw new Error("未定義関数: " + funcName);
          const localEnv = Object.create(env);
          let ret = 0;
          for (let line2 of f.body) {
            if (line2.startsWith("return ")) {
              ret = evalExpr(line2.slice(7), localEnv, funcs);
              break;
            } else if (line2.startsWith("let ")) {
              const [, rest2] = line2.split("let ");
              const [name2, ex2] = rest2.split("=");
              localEnv[name2.trim()] = evalExpr(ex2.trim(), localEnv, funcs);
              env[name2.trim()] = localEnv[name2.trim()]; // global共有
            } else if (line2.startsWith("print ")) {
              outputCb(String(evalExpr(line2.slice(6), localEnv, funcs)));
            }
          }
        }
        pc++;
      } else {
        pc++;
      }
    }
  }

  // UI結線
  const srcEl = document.getElementById('src');
  const outEl = document.getElementById('out');
  document.getElementById('run').addEventListener('click', () => {
    outEl.textContent = '';
    try {
      const lines = parseLines(srcEl.value);
      runProgram(lines, (line)=>{ outEl.textContent += line+"\n"; });
    } catch(e) {
      outEl.textContent = "エラー: "+e.message;
    }
  });
})();
</script>
</body>
</html>
