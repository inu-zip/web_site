<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ミニ言語インタプリタ</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; background: #fafafa; }
    h1 { margin-bottom: 0.5rem; }
    label { font-weight: bold; display: block; margin-top: 1rem; }
    textarea { width: 100%; height: 180px; font-family: monospace; }
    pre { background: #f0f0f0; padding: 0.75rem; white-space: pre-wrap; border: 1px solid #ccc; }
    button { padding: 0.5rem 1rem; margin-top: 0.5rem; }
    .section { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>ミニ言語（let / print / 四則演算 / float対応）</h1>

  <div class="section">
    <label for="src">プログラム入力:</label>
    <textarea id="src">let x = 2.5 + 3 * 4
print x
let y = (x - 5.5) / 3
print y</textarea>
    <button id="run">実行</button>
  </div>

  <div class="section">
    <label for="out">実行結果:</label>
    <pre id="out"></pre>
  </div>

<script>
(() => {
  // ====== トークナイザ ======
  function tokenize(input) {
    const tokens = [];
    const re = /\s+|\/\/[^\n]*|([A-Za-z_]\w*)|(\d+(?:\.\d+)?)|([()+\-*/=])/g;
    let m;
    while ((m = re.exec(input)) !== null) {
      if (m[0].trim() === '' || m[0].startsWith('//')) continue;
      if (m[1]) tokens.push({ type: 'IDENT', value: m[1] });
      else if (m[2]) tokens.push({ type: 'NUMBER', value: Number(m[2]) });
      else if (m[3]) tokens.push({ type: 'SYMBOL', value: m[3] });
    }
    return tokens;
  }

  // ====== パーサ ======
  function parse(tokens) {
    let i = 0;
    const peek = () => tokens[i];
    const consume = (type, value=null) => {
      const t = tokens[i];
      if (!t || t.type !== type || (value !== null && t.value !== value)) {
        throw new SyntaxError(`予期しないトークン: ${JSON.stringify(t)}; 期待: ${type}${value?(' '+value):''}`);
      }
      i++;
      return t;
    };

    function parseProgram() {
      const stmts = [];
      while (i < tokens.length) {
        stmts.push(parseStmt());
      }
      return { type: 'Program', body: stmts };
    }

    function parseStmt() {
      const t = peek();
      if (t && t.type === 'IDENT' && t.value === 'let') {
        consume('IDENT', 'let');
        const id = consume('IDENT');
        consume('SYMBOL', '=');
        const expr = parseExpr();
        return { type: 'Let', id: id.value, expr };
      }
      if (t && t.type === 'IDENT' && t.value === 'print') {
        consume('IDENT', 'print');
        const expr = parseExpr();
        return { type: 'Print', expr };
      }
      throw new SyntaxError(`文の先頭が不正です: ${JSON.stringify(t)}`);
    }

    function parseExpr() {
      let node = parseTerm();
      while (peek() && peek().type === 'SYMBOL' && (peek().value === '+' || peek().value === '-')) {
        const op = consume('SYMBOL').value;
        const right = parseTerm();
        node = { type: 'Binary', op, left: node, right };
      }
      return node;
    }

    function parseTerm() {
      let node = parseFactor();
      while (peek() && peek().type === 'SYMBOL' && (peek().value === '*' || peek().value === '/')) {
        const op = consume('SYMBOL').value;
        const right = parseFactor();
        node = { type: 'Binary', op, left: node, right };
      }
      return node;
    }

    function parseFactor() {
      const t = peek();
      if (!t) throw new SyntaxError('式が途中で終わっています');
      if (t.type === 'NUMBER') { consume('NUMBER'); return { type: 'Number', value: t.value }; }
      if (t.type === 'IDENT') {
        if (t.value === 'let' || t.value === 'print') throw new SyntaxError('ここでキーワードは使えません');
        consume('IDENT');
        return { type: 'Var', name: t.value };
      }
      if (t.type === 'SYMBOL' && t.value === '(') {
        consume('SYMBOL', '(');
        const expr = parseExpr();
        consume('SYMBOL', ')');
        return expr;
      }
      throw new SyntaxError(`不正な因子: ${JSON.stringify(t)}`);
    }

    const ast = parseProgram();
    if (i !== tokens.length) throw new SyntaxError('未消費のトークンがあります');
    return ast;
  }

  // ====== インタプリタ ======
  function evaluate(ast, outputCb) {
    const env = Object.create(null);

    function evalExpr(node) {
      switch (node.type) {
        case 'Number': return node.value;
        case 'Var':
          if (!(node.name in env)) throw new ReferenceError(`未定義の変数: ${node.name}`);
          return env[node.name];
        case 'Binary': {
          const l = evalExpr(node.left);
          const r = evalExpr(node.right);
          switch (node.op) {
            case '+': return l + r;
            case '-': return l - r;
            case '*': return l * r;
            case '/': return r === 0 ? (() => { throw new Error('ゼロ除算'); })() : l / r;
            default: throw new Error(`未知の演算子: ${node.op}`);
          }
        }
        default: throw new Error(`未知の式ノード: ${node.type}`);
      }
    }

    for (const stmt of ast.body) {
      if (stmt.type === 'Let') {
        env[stmt.id] = evalExpr(stmt.expr);
      } else if (stmt.type === 'Print') {
        const v = evalExpr(stmt.expr);
        outputCb(String(v));
      } else {
        throw new Error(`未知の文ノード: ${stmt.type}`);
      }
    }
  }

  // ====== UI ======
  const srcEl = document.getElementById('src');
  const outEl = document.getElementById('out');
  document.getElementById('run').addEventListener('click', () => {
    outEl.textContent = '';
    const input = srcEl.value;
    try {
      const tokens = tokenize(input);
      const ast = parse(tokens);
      evaluate(ast, (line) => {
        outEl.textContent += line + '\n';
      });
    } catch (e) {
      outEl.textContent = 'エラー: ' + e.message;
    }
  });
})();
</script>
</body>
</html>
