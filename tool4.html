<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>横スクロールアクション</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #87ceeb;
  }
  #game {
    background: #87ceeb;
    display: block;
  }
  #controller {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
  }
  #controller button {
    width: 60px;
    height: 60px;
    font-size: 24px;
    border-radius: 10px;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>

<!-- コントローラー -->
<div id="controller">
  <button id="left">←</button>
  <button id="right">→</button>
  <button id="jump">A</button>
</div>

<script>
// ===============================
// 基本設定
// ===============================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = { left: false, right: false, jump: false };

// ===============================
// ステージデータ
// ===============================
const stage = {
  player: { x: 50, y: 0, w: 30, h: 40, vx: 0, vy: 0 },
  goal: { x: 1800, y: 300, w: 40, h: 40 },
  blocks: [
    { x: 0, y: 350, w: 800, h: 50 },
    { x: 800, y: 350, w: 800, h: 50 }
  ],
  spikes: [
    { x: 600, y: 330, w: 40, h: 20 }
  ],
  enemies: [
    { x: 900, y: 310, w: 40, h: 40, dir: 1, range: 100, startX: 900 }
  ]
};

let cameraX = 0;

// ===============================
// 入力（PC）
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") keys.left = true;
  if (e.key === "ArrowRight") keys.right = true;
  if (e.key === " " || e.key === "ArrowUp") keys.jump = true;
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
  if (e.key === " " || e.key === "ArrowUp") keys.jump = false;
});

// 入力（スマホ）
document.getElementById("left").onmousedown = () => keys.left = true;
document.getElementById("left").onmouseup = () => keys.left = false;
document.getElementById("right").onmousedown = () => keys.right = true;
document.getElementById("right").onmouseup = () => keys.right = false;
document.getElementById("jump").onmousedown = () => keys.jump = true;
document.getElementById("jump").onmouseup = () => keys.jump = false;

// ===============================
// 当たり判定
function hit(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

// ===============================
// メインループ
function update() {
  const p = stage.player;

  // 横移動
  if (keys.left) p.vx = -3;
  else if (keys.right) p.vx = 3;
  else p.vx = 0;

  // ジャンプ
  if (keys.jump && p.onGround) {
    p.vy = -10;
    p.onGround = false;
  }

  // 重力
  p.vy += 0.5;

  // 移動
  p.x += p.vx;
  p.y += p.vy;

  // 地面・ブロックとの当たり判定
  p.onGround = false;
  for (const b of stage.blocks) {
    if (hit(p, b)) {
      if (p.vy > 0) {
        p.y = b.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
  }

  // 敵の移動
  for (const e of stage.enemies) {
    e.x += e.dir * 2;
    if (e.x > e.startX + e.range) e.dir = -1;
    if (e.x < e.startX - e.range) e.dir = 1;

    if (hit(p, e)) {
      alert("ゲームオーバー");
      location.reload();
    }
  }

  // トゲ
  for (const s of stage.spikes) {
    if (hit(p, s)) {
      alert("ゲームオーバー");
      location.reload();
    }
  }

  // ゴール
  if (hit(p, stage.goal)) {
    alert("クリア！");
    location.reload();
  }

  // カメラ追従
  cameraX = p.x - 200;

  draw();
  requestAnimationFrame(update);
}

// ===============================
// 描画
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const offset = cameraX;

  // ブロック
  ctx.fillStyle = "#654321";
  for (const b of stage.blocks) {
    ctx.fillRect(b.x - offset, b.y, b.w, b.h);
  }

  // トゲ
  ctx.fillStyle = "red";
  for (const s of stage.spikes) {
    ctx.fillRect(s.x - offset, s.y, s.w, s.h);
  }

  // 敵
  ctx.fillStyle = "purple";
  for (const e of stage.enemies) {
    ctx.fillRect(e.x - offset, e.y, e.w, e.h);
  }

  // ゴール
  ctx.fillStyle = "yellow";
  ctx.fillRect(stage.goal.x - offset, stage.goal.y, stage.goal.w, stage.goal.h);

  // プレイヤー
  const p = stage.player;
  ctx.fillStyle = "blue";
  ctx.fillRect(p.x - offset, p.y, p.w, p.h);
}

// ===============================
update();
</script>

</body>
</html>
